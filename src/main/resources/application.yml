server:
  port: 8081
  servlet:
    context-path: /spq

spring:
  datasource:
    url: jdbc:h2:mem:spring-graphql;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      mode: always
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
